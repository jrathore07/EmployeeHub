<h1>Employee List</h1>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Employee Id</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email Id</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (employee of employees; track employee.id) {
      <tr>
        <td>{{ employee.id }}</td>
        <td>{{ employee.firstName }}</td>
        <td>{{ employee.lastName }}</td>
        <td>{{ employee.email }}</td>
        <td>
          <button (click)="updateEmployee(employee.id)" class="btn btn-info">
            ✏️ Update
          </button>

          <button class="btn btn-danger" (click)="deleteEmployee(employee.id)">
            🗑️ Delete
          </button>
          <button class="btn btn-info" (click)="employeeDetails(employee.id)">
            👁️ View
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
<p>bv</p>
